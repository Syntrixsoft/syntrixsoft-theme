<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="SyntrixSoft">
  <defs>
    <!-- Brand gradient: cyan → violet → pink -->
    <linearGradient id="g-brand" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#22d3ee"/>
      <stop offset="48%"  stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <!-- Background tile gradient -->
    <linearGradient id="g-bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0f0f22"/>
      <stop offset="100%" stop-color="#040409"/>
    </linearGradient>
    <!-- Atmospheric inner glow -->
    <radialGradient id="g-atm" cx="48%" cy="38%" r="52%">
      <stop offset="0%"   stop-color="#a855f7" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- S glow bloom -->
    <filter id="f-bloom" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Subtle edge light filter -->
    <filter id="f-edge">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip-rr">
      <rect width="100" height="100" rx="24"/>
    </clipPath>
  </defs>

  <!-- ── Background ── -->
  <rect width="100" height="100" rx="24" fill="url(#g-bg)"/>
  <!-- atmospheric glow inside -->
  <rect width="100" height="100" rx="24" fill="url(#g-atm)" clip-path="url(#clip-rr)"/>

  <!-- ── Border: double-line neon ring ── -->
  <!-- outer subtle ring -->
  <rect x="2" y="2" width="96" height="96" rx="22.5"
        stroke="url(#g-brand)" stroke-width="1" stroke-opacity="0.35" fill="none"/>
  <!-- bright inner ring -->
  <rect x="4" y="4" width="92" height="92" rx="21"
        stroke="url(#g-brand)" stroke-width="2.2" fill="none"
        filter="url(#f-edge)"/>

  <!-- ── Corner circuit pads ── -->
  <circle cx="21" cy="21" r="3.2" fill="#22d3ee" opacity="0.9"/>
  <circle cx="79" cy="21" r="3.2" fill="#a855f7" opacity="0.9"/>
  <circle cx="79" cy="79" r="3.2" fill="#ec4899" opacity="0.9"/>
  <circle cx="21" cy="79" r="3.2" fill="#ec4899" opacity="0.9"/>

  <!-- Corner trace lines -->
  <path d="M21 24.5V31 M24.5 21H31"
        stroke="#22d3ee" stroke-width="1.3" opacity="0.5" stroke-linecap="round"/>
  <path d="M79 24.5V31 M75.5 21H69"
        stroke="#a855f7" stroke-width="1.3" opacity="0.5" stroke-linecap="round"/>
  <path d="M79 75.5V69 M75.5 79H69"
        stroke="#ec4899" stroke-width="1.3" opacity="0.5" stroke-linecap="round"/>
  <path d="M21 75.5V69 M24.5 79H31"
        stroke="#ec4899" stroke-width="1.3" opacity="0.5" stroke-linecap="round"/>

  <!-- ── S glyph — three-arc cubic bezier ── -->
  <!-- Glow bloom layer (wider, blurred) -->
  <path
    d="M 66,33 C 66,23 34,23 34,33 C 34,43 66,53 66,63 C 66,73 34,73 34,63"
    stroke="url(#g-brand)" stroke-width="15" stroke-linecap="round" fill="none"
    opacity="0.28" filter="url(#f-bloom)"/>
  <!-- Crisp S -->
  <path
    d="M 66,33 C 66,23 34,23 34,33 C 34,43 66,53 66,63 C 66,73 34,73 34,63"
    stroke="url(#g-brand)" stroke-width="10.5" stroke-linecap="round" fill="none"/>

  <!-- ── Center accent dot ── -->
  <circle cx="50" cy="48.5" r="2.8" fill="#fff" opacity="0.9"/>
  <circle cx="50" cy="48.5" r="5.5" fill="#a855f7" opacity="0.2"/>
</svg>
